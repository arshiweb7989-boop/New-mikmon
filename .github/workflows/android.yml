name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android Project
        run: |
          mkdir -p android-project

          # Copy project files
          cp -r . android-project/source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find Gradle Project
        run: |
          echo "Searching for Gradle project..."
          find . -name "gradlew" -type f
          find . -name "build.gradle" -o -name "build.gradle.kts"

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "./android-project/gradlew" ]; then
            chmod +x ./android-project/gradlew
            cd android-project
            ./gradlew assembleDebug
          else
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

      - name: Locate APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p apk-output

          APK=$(find . -type f -name "*-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find . -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" apk-output/MAGI-MON-debug.apk

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAGI-MON-APK
          path: apk-output/MAGI-MON-debug.apk
          if-no-files-found: error
          retention-days: 30
