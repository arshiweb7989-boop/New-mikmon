name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find Android Project
        run: |
          echo "Searching for Android/Gradle project..."
          find . -name "gradlew" -type f -print
          find . -name "build.gradle" -type f -print
          find . -name "build.gradle.kts" -type f -print

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle project found in root"
            chmod +x ./gradlew
            ./gradlew assembleDebug

          elif [ -f "./android/gradlew" ]; then
            echo "Gradle project found in android/"
            chmod +x ./android/gradlew
            cd android
            ./gradlew assembleDebug

          else
            echo "ERROR: No Gradle Android project found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

      - name: Locate APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p apk-output

          APK=$(find . -type f -name "*-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find . -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "apk-output/MAGI-MON-debug.apk"

          ls -lh apk-output/MAGI-MON-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAGI-MON-APK
          path: apk-output/MAGI-MON-debug.apk
          if-no-files-found: error
          retention-days: 30
