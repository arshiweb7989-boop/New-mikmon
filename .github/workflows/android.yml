name: Build New Mikhmon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build New Mikhmon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          mkdir -p apk-output
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" apk-output/New-Mikhmon-debug.apk
          ls -lh apk-output/New-Mikhmon-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Mikhmon-APK
          path: apk-output/New-Mikhmon-debug.apk
          if-no-files-found: error
          retention-days: 30
