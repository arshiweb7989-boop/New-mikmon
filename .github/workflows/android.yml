name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli

      - name: Create Android Project
        run: |
          mkdir -p android-project
          cd android-project

          npm init -y

          npm install @capacitor/core @capacitor/android

          npx cap init "MAGI-MON" "com.magimon.app" --web-dir=www

          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MAGI-MON</title>
          </head>
          <body>
            <h1>MAGI-MON</h1>
            <p>MikroTik Hotspot Manager</p>
          </body>
          </html>
          EOF

          npx cap add android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android-project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Locate APK
        run: |
          echo "Searching for APK..."
          find android-project -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p apk-output

          APK=$(find android-project -type f -name "*-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found: $APK"

          cp "$APK" apk-output/MAGI-MON-debug.apk

          ls -lh apk-output/MAGI-MON-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAGI-MON-APK
          path: apk-output/MAGI-MON-debug.apk
          if-no-files-found: error
          retention-days: 30
